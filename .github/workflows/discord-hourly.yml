name: Resumo Horário Discord

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar aviso para o Discord
        run: |
          curl -H "Content-Type: application/json" \
          -d '{"content": "✅ **Status Horário:** O XYZ Tools encontra-se ativo e funcionando normalmente."}' \
          ${{ secrets.NOTIFICATION_DISCORD_WEBHOOK_URL }}
